services:
  - type: web
    name: flock-and-field-poultry
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: poultry-records
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_PATH
        value: /var/data/poultry.sqlite
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: COOKIE_SECURE
        value: "true"
